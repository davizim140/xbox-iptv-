name: Validate curl HTTP HTTPS on XSDK

on:
  push:
    paths:
      - ".github/workflows/curl-xsdk-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curl-xsdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Xbox IPTV
        uses: actions/checkout@v4

      - name: Install XSDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Fetch pinned XSDK
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$RUNNER_TEMP/xsdk"
          git -C "$RUNNER_TEMP/xsdk" checkout --detach 9e6de98f6b5d737bce0fecd2864edae94bdd2637

      - name: Restore XSDK toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.xsdk-gcc
            ${{ runner.temp }}/xsdk-gcc-work
          key: xsdk-toolchain-${{ runner.os }}-9e6de98f6b5d737bce0fecd2864edae94bdd2637

      - name: Build XSDK PowerPC toolchain if cache is cold
        env:
          PREFIX: ${{ github.workspace }}/.xsdk-gcc
          WORK: ${{ runner.temp }}/xsdk-gcc-work
          JOBS: 2
        run: bash "$RUNNER_TEMP/xsdk/tools/toolchain/build.sh"

      - name: Build XSDK runtime and host shader compiler
        run: >-
          make -C "$RUNNER_TEMP/xsdk" -j2
          TOOLCHAIN="${{ github.workspace }}/.xsdk-gcc/bin/powerpc-xsdk-elf-"
          build/libxsdk.a build/host/libxsc.so

      - name: Fetch pinned curl-xenon and mbedtls-xenon
        run: |
          git clone https://github.com/xenosworks/curl-xenon.git "$RUNNER_TEMP/curl-xenon"
          git -C "$RUNNER_TEMP/curl-xenon" checkout --detach a6b70bd06820e1c625f47fe0e592e08c5daaa6b4
          git clone https://github.com/xenosworks/mbedtls-xenon.git "$RUNNER_TEMP/mbedtls-xenon"
          git -C "$RUNNER_TEMP/mbedtls-xenon" checkout --detach 591b04adbec4bc5582649601f4407506a610162b
          git -C "$RUNNER_TEMP/mbedtls-xenon" submodule update --init --recursive

      - name: Configure curl HTTP HTTPS compatibility test
        run: >-
          cmake -S "$RUNNER_TEMP/curl-xenon/tests/xsdk"
          -B "$RUNNER_TEMP/curl-xsdk-build" -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/xsdk/cmake/xsdk.cmake"
          -DXSDK_TOOLCHAIN="${{ github.workspace }}/.xsdk-gcc"
          -DCMAKE_BUILD_TYPE=Release
          -DMBEDTLS_XENON_DIR="$RUNNER_TEMP/mbedtls-xenon"

      - name: Build curl_check XEX
        run: cmake --build "$RUNNER_TEMP/curl-xsdk-build" --parallel 2

      - name: Verify curl_check XEX
        run: test -s "$RUNNER_TEMP/curl-xsdk-build/curl_check.xex"

      - name: Upload curl compatibility XEX
        uses: actions/upload-artifact@v4
        with:
          name: xbox-iptv-curl-xsdk-compat
          path: ${{ runner.temp }}/curl-xsdk-build/curl_check.xex
          if-no-files-found: error
          retention-days: 14
